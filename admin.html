<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Painel da loja</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<header><h1>Painel</h1></header>
<main style="padding-bottom:40px">
<form id="login" class="card"><h2 style="margin-top:0">Entrar</h2>
 <label class="f" for="tk">Chave de acesso (token do GitHub)</label><input type="password" id="tk" required>
 <p style="font-size:.85rem;color:#5b4470">Você cola a chave uma vez; ela fica guardada só neste aparelho.</p>
 <button class="btn" style="background:var(--berry);color:#fff">Entrar</button><div class="msg" id="le"></div></form>
<div id="panel" hidden>
 <h2>Tamanhos</h2><div id="sizes"></div><button class="btn alt" data-add="sizes">+ Tamanho</button>
 <h2>Complementos</h2><div id="tops"></div><button class="btn alt" data-add="tops">+ Complemento</button>
 <h2>Loja</h2>
 <label class="opt"><span class="l"><input type="checkbox" id="open"><b>Loja aberta (aceitando pedidos)</b></span></label>
 <label class="f" for="loja" style="margin-top:10px">Nome da loja</label><input type="text" id="loja">
 <label class="f" for="fee" style="margin-top:10px">Taxa de entrega (R$)</label><input type="number" step="0.5" id="fee">
 <label class="f" for="pix" style="margin-top:10px">Chave Pix</label><input type="text" id="pix">
 <label class="f" for="pixNome" style="margin-top:10px">Nome do recebedor (como no Pix)</label><input type="text" id="pixNome">
 <label class="f" for="pixCidade" style="margin-top:10px">Cidade</label><input type="text" id="pixCidade">
 <label class="f" for="whats" style="margin-top:10px">WhatsApp que recebe os pedidos (55 + DDD + número)</label><input type="text" id="whats">
 <p><button class="btn" id="save" style="background:var(--berry);color:#fff">Salvar alterações</button></p>
 <div id="ok" style="font-weight:600"></div>
 <p><button class="btn alt" id="out">Sair</button></p>
</div></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const host=location.hostname,O=host.endsWith("github.io")?host.split(".")[0]:null,P=O?location.pathname.split("/")[1]:null;
const API=`https://api.github.com/repos/${O}/${P}/contents/menu.json`;
let M,sha,T=localStorage.getItem("gh_token");
const H=()=>({Authorization:"Bearer "+T,Accept:"application/vnd.github+json"});
async function get(){
 const r=await fetch(API+"?t="+Date.now(),{headers:H()});if(!r.ok)throw 0;
 const j=await r.json();sha=j.sha;M=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))));
}
async function enter(){try{await get();$("#login").hidden=true;$("#panel").hidden=false;draw()}catch(e){localStorage.removeItem("gh_token");$("#le").textContent="Chave inválida ou sem permissão neste repositório.";$("#login").hidden=false}}
$("#login").onsubmit=e=>{e.preventDefault();T=$("#tk").value.trim();localStorage.setItem("gh_token",T);enter()};
$("#out").onclick=()=>{localStorage.removeItem("gh_token");location.reload()};
if(T&&O)enter();
const row=(k,i,s)=>`<div class="row"><input type="text" value="${esc(s.n)}" data-k="${k}" data-i="${i}" data-f="n" aria-label="Nome"><input type="number" step="0.5" value="${s.p}" data-k="${k}" data-i="${i}" data-f="p" aria-label="Preço"><button data-del="${k}:${i}" aria-label="Remover">✕</button></div>`;
function draw(){
 $("#sizes").innerHTML=M.sizes.map((s,i)=>row("sizes",i,s)).join("");
 $("#tops").innerHTML=M.tops.map((s,i)=>row("tops",i,s)).join("");
 for(const f of ["loja","fee","pix","pixNome","pixCidade","whats"])$("#"+f).value=M[f]??"";
 $("#open").checked=!!M.open;
}
$("#panel").addEventListener("input",e=>{const t=e.target;if(t.dataset.k)M[t.dataset.k][+t.dataset.i][t.dataset.f]=t.dataset.f=="p"?+t.value:t.value});
$("#panel").addEventListener("click",e=>{
 const a=e.target.dataset.add,d=e.target.dataset.del;
 if(a){M[a].push({n:"",p:0});draw()}
 if(d){const[k,i]=d.split(":");M[k].splice(+i,1);draw()}
});
$("#save").onclick=async()=>{
 for(const f of ["loja","pix","pixNome","pixCidade","whats"])M[f]=$("#"+f).value.trim();
 M.fee=+$("#fee").value||0;M.open=$("#open").checked;
 M.sizes=M.sizes.filter(x=>x.n.trim());M.tops=M.tops.filter(x=>x.n.trim());
 $("#ok").style.color="var(--ink)";$("#ok").textContent="Salvando...";
 const r=await fetch(API,{method:"PUT",headers:H(),body:JSON.stringify({message:"Atualiza cardápio",sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(M,null,2))))})});
 if(r.ok){sha=(await r.json()).content.sha;draw();$("#ok").style.color="var(--ok)";$("#ok").textContent="Salvo! Em cerca de 1 minuto o site mostra as mudanças."}
 else{$("#ok").style.color="#a3262a";$("#ok").textContent="Não foi possível salvar. Confira se a chave tem permissão de escrita."}
};
if(!O)$("#le").textContent="Abra este painel pelo endereço do site no GitHub Pages.";
</script></body></html>
